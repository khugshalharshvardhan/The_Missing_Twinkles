<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mystery: Lights Out</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%8F%AE</text></svg>" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/stage.css" />
  <link rel="stylesheet" href="css/story.css" />

  <link rel="preload" href="assets/fonts/FredokaOne-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/images/bg_town_lit.jpg" as="image" />
</head>
<body>

  <!-- The viewport letterboxes a fixed 1920x1080 stage so every Figma
       coordinate can be used verbatim. See js/stage.js. -->
  <div id="viewport">
    <div id="stage">

      <!-- Story scenes are built from js/data/scenes.js -->
      <div class="scene" id="scene-a"></div>
      <div class="scene" id="scene-b"></div>

      <!-- Wipes to black for the lights-out beat -->
      <div class="blackout" id="blackout"></div>

      <!-- ===== HUD ===== -->
      <div class="hud" id="hud">
        <p class="beat" id="beat"></p>

        <button class="tap" id="tap" data-action="next" aria-label="Continue">
          <span class="tap__chevron"></span>
        </button>

        <button class="skip" data-action="skip">Skip</button>
        <ol class="dots" id="dots" aria-hidden="true"></ol>
      </div>

      <!-- ===== Loader ===== -->
      <div class="loader is-active" id="loader">
        <p class="loader__title">Lights Out</p>
        <div class="loader__track"><i class="loader__bar" id="loader-bar"></i></div>
        <p class="loader__note" id="loader-note">Waking the town…</p>
        <button class="cta" id="loader-cta" data-action="begin" hidden>Begin the story</button>
      </div>

      <!-- ===== End card — the seam where the puzzle takes over ===== -->
      <div class="endcard" id="endcard">
        <p class="endcard__kicker">Chapter 1</p>
        <p class="endcard__title">Lights Out</p>
        <p class="endcard__note">The little light-keepers are out there somewhere.</p>
        <div class="endcard__row">
          <button class="cta" data-action="replay">Watch again</button>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
