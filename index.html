<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Missing Twinkels</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%8F%AE</text></svg>" />

  <link rel="stylesheet" href="css/reset.css?v=2" />
  <link rel="stylesheet" href="css/stage.css?v=2" />
  <link rel="stylesheet" href="css/story.css?v=2" />
  <link rel="stylesheet" href="css/game.css?v=2" />
  <link rel="stylesheet" href="css/walk.css?v=2" />
  <link rel="stylesheet" href="css/warp.css?v=2" />

  <!-- The Devanagari subset carries every line of dialogue, so it is fetched
       up front; the Latin one only has the digits and is small enough to wait
       for the stylesheet. -->
  <link rel="preload" href="assets/fonts/Baloo2-SemiBold-devanagari.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/FredokaOne-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/Creepster-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <!-- The cover is the first thing on screen, so it is fetched ahead of the
       story art the loader is filling the bar for. -->
  <link rel="preload" href="assets/images/cover_hindi.webp" as="image" />
  <link rel="preload" href="assets/images/play_btn_night.svg" as="image" type="image/svg+xml" />
  <link rel="preload" href="assets/images/bg_town_lit.webp" as="image" />
</head>
<!-- Both acts live in this one document. data-act says which is on stage;
     js/main.js flips it behind the mist, so nothing ever navigates. -->
<body data-act="story">

  <!-- The viewport letterboxes the stage so every Figma coordinate can be used
       verbatim. The frame is 1920x1080 for the story and 1882x1059 for the
       game; js/stage.js resizes it when the act changes. -->
  <div id="viewport">
    <div id="stage">

      <!-- ===== Act one: the story =====
           Three pages, built from js/data/scenes.js. Layers persist across the
           steps within a page; overlays are rebuilt each step. -->
      <div class="scene" id="story">
        <div class="layers" id="layers"></div>
        <div class="overlays" id="overlays"></div>
      </div>

      <!-- Covers a page change — the fireflies out of the dark -->
      <div class="transition" id="transition"></div>

      <!-- ===== Between the two: the walk =====
           They follow a firefly down the path to the clearing the game opens
           on. Drawn in the game's frame, so arriving needs no frame change —
           see js/walk.js. -->
      <div id="walk"></div>

      <!-- ===== Act two: the counting game =====
           Sixteen screens, built from js/data/screens.js into two panes that
           cross-fade. Empty until the story hands over. -->
      <div id="game">
        <div class="scene" id="game-a"></div>
        <div class="scene" id="game-b"></div>
        <!-- The hand-over between levels builds itself in here, as a child of
             the game: the place being left is a CLONE of the live pane, and a
             clone outside #game would lose all 150-odd rules scoped to it —
             the balloon on it would come out unpositioned and fill the screen.
             See js/warp.js. -->
      </div>


      <!-- ===== HUD ===== -->
      <div class="hud" id="hud">
        <p class="beat" id="beat"></p>

        <!-- Page turning, story only. Next appears once a page has finished
             playing — or straight away on a page already read — and Prev
             whenever there is a page behind this one; see js/story.js. One
             piece of supplied art for both, so the pair can never drift apart:
             nav_arrow.svg (amber), mirrored in CSS to point back. A blue
             variant ships alongside it as nav_arrow_blue.svg — switching a
             button's colour is one filename here. -->
        <button class="nav nav--prev" id="nav-prev" data-action="prev" aria-label="Previous page">
          <img class="nav__art" src="assets/images/nav_arrow.svg" alt="" />
        </button>
        <button class="nav nav--next" id="nav-next" data-action="next" aria-label="Next page">
          <img class="nav__art" src="assets/images/nav_arrow.svg" alt="" />
        </button>

      </div>

      <!-- Sound toggle sits above the loader and end card so it is always
           reachable, not just during the story. -->
      <button class="sound" id="sound" data-action="sound" aria-pressed="true" aria-label="Turn sound off">
        <svg class="sound__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="sound__cone" d="M3.4 9h3.4l4.9-4v14l-4.9-4H3.4z" />
          <path class="sound__wave" d="M15.4 9.3a3.9 3.9 0 0 1 0 5.4" />
          <path class="sound__wave" d="M18.1 6.7a7.6 7.6 0 0 1 0 10.6" />
          <path class="sound__slash" d="M4.6 19.4 19.4 4.6" />
        </svg>
      </button>

      <!-- ===== Loader — the cover ===== -->
      <!-- The cover art carries the title, so there is no title text here; the
           bar and the note are the only things the art does not already say. -->
      <div class="loader is-active" id="loader">
        <div class="loader__track"><i class="loader__bar" id="loader-bar"></i></div>
        <p class="loader__note" id="loader-note">Waking the town…</p>
        <!-- One way in. The story runs, the pair walk down the path, and the
             counting game opens at the end of it. The label is on aria-label
             only: the button is the icon.

             The art is play_btn.svg, recoloured. Four versions ship, all the
             same fourteen paths with seven colour tokens swapped, so switching
             is one filename here:

               play_btn.svg             amber, as supplied
               play_btn_lamplight.svg   paler gold, the colour of the town's lamps
               play_btn_night.svg       violet body, gold rim   <- in use
               play_btn_night_gold.svg  as night, with a gold play mark

             Night is the one in use because it is the title sign's own palette —
             dark board, gold edge — and the witch hat's violet, so it belongs to
             the cover rather than sitting on top of it. The amber versions read
             as another lamp and compete with the real ones. The white mark stays
             white in this one: gold on violet is prettier but loses the contrast
             that makes it obviously a play button.

             The bloom and the twinkles are treatments in CSS, not part of the
             art, so they survive a change of variant. -->
        <button class="play" id="loader-cta" data-action="begin" aria-label="Play" hidden>
          <i class="play__bloom" aria-hidden="true"></i>
          <img class="play__art" src="assets/images/play_btn_night.svg" alt="" />
          <!-- Three, because that is what the game is about counting. Different
               periods with one reversed, so they never fall into step. -->
          <i class="play__orbit" aria-hidden="true"><i class="play__spark"></i></i>
          <i class="play__orbit play__orbit--b" aria-hidden="true"><i class="play__spark"></i></i>
          <i class="play__orbit play__orbit--c" aria-hidden="true"><i class="play__spark"></i></i>
        </button>
      </div>

    </div>
  </div>


  <script type="module" src="js/main.js"></script>
</body>
</html>
