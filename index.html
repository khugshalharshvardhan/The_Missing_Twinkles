<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mystery: Lights Out</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%8F%AE</text></svg>" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/stage.css" />
  <link rel="stylesheet" href="css/story.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/handoff.css" />

  <link rel="preload" href="assets/fonts/FredokaOne-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/images/bg_town_lit.webp" as="image" />
</head>
<!-- Both acts live in this one document. data-act says which is on stage;
     js/main.js flips it behind the mist, so nothing ever navigates. -->
<body data-act="story">

  <!-- The viewport letterboxes the stage so every Figma coordinate can be used
       verbatim. The frame is 1920x1080 for the story and 1882x1059 for the
       game; js/stage.js resizes it when the act changes. -->
  <div id="viewport">
    <div id="stage">

      <!-- ===== Act one: the story =====
           Three pages, built from js/data/scenes.js. Layers persist across the
           steps within a page; overlays are rebuilt each step. -->
      <div class="scene" id="story">
        <div class="layers" id="layers"></div>
        <div class="overlays" id="overlays"></div>
      </div>

      <!-- Covers a page change — the fireflies out of the dark -->
      <div class="transition" id="transition"></div>

      <!-- ===== Act two: the counting game =====
           Sixteen screens, built from js/data/screens.js into two panes that
           cross-fade. Empty until the story hands over. -->
      <div id="game">
        <div class="scene" id="game-a"></div>
        <div class="scene" id="game-b"></div>
      </div>


      <!-- ===== HUD ===== -->
      <div class="hud" id="hud">
        <p class="beat" id="beat"></p>

        <button class="tap" id="tap" data-action="next" aria-label="Continue">
          <span class="tap__chevron"></span>
        </button>

        <button class="skip" data-action="skip">Skip</button>
        <ol class="dots" id="dots" aria-hidden="true"></ol>
      </div>

      <!-- Sound toggle sits above the loader and end card so it is always
           reachable, not just during the story. -->
      <button class="sound" id="sound" data-action="sound" aria-pressed="true" aria-label="Turn sound off">
        <svg class="sound__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="sound__cone" d="M3.4 9h3.4l4.9-4v14l-4.9-4H3.4z" />
          <path class="sound__wave" d="M15.4 9.3a3.9 3.9 0 0 1 0 5.4" />
          <path class="sound__wave" d="M18.1 6.7a7.6 7.6 0 0 1 0 10.6" />
          <path class="sound__slash" d="M4.6 19.4 19.4 4.6" />
        </svg>
      </button>

      <!-- ===== Loader ===== -->
      <div class="loader is-active" id="loader">
        <p class="loader__title">Lights Out</p>
        <div class="loader__track"><i class="loader__bar" id="loader-bar"></i></div>
        <p class="loader__note" id="loader-note">Waking the town…</p>
        <!-- One way in. The story runs, the mist closes over it, and the
             counting game opens on the other side — see js/handoff.js. -->
        <button class="cta" id="loader-cta" data-action="begin" hidden>Begin</button>
      </div>

      <!-- ===== End card — the chapter closes after the game ===== -->
      <div class="endcard" id="endcard">
        <p class="endcard__kicker">Chapter 1</p>
        <p class="endcard__title">Well counted</p>
        <p class="endcard__note">Guess, then count to check. That is the whole trick.</p>
        <div class="endcard__row">
          <button class="cta" data-action="replay">Play again</button>
        </div>
      </div>

    </div>
  </div>

  <!-- The mist that carries us from the story into the game. It sits
       outside the stage on purpose — the stage is letterboxed and carries a
       transform, so a cover inside it would leave the bars showing and could
       not be fixed to the viewport. -->
  <div class="handoff" id="handoff" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
